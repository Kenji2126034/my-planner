<script>
(()=>{'use strict';
const KEY='my-planner-offline-v1', ICON=(name,klass='')=>`<svg class="icon ${klass}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const DEFAULT_CATS=[{name:'就活',color:'#4776d5',icon:'briefcase'},{name:'研究',color:'#9a70cf',icon:'book'},{name:'大学',color:'#dc9852',icon:'folder'},{name:'生活',color:'#26a391',icon:'heart'}];
const $=sel=>document.querySelector(sel);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>globalThis.crypto?.randomUUID?.()||'id_'+Date.now()+'_'+Math.random().toString(36).slice(2);
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{let n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`};
const dateObj=s=>{if(!s)return null;const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const plusDays=(s,n)=>{let d=dateObj(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=day=>day===0?6:day-1;
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&dateObj(s)&&iso(dateObj(s))===s;
const timeValid=s=>!s||/^([01]\d|2[0-3]):[0-5]\d$/.test(s);
const fmtDate=(s,includeYear=false)=>{if(!validDate(s))return '期限なし';let d=dateObj(s);return `${includeYear?`${d.getFullYear()}/`:''}${d.getMonth()+1}/${d.getDate()}（${'日月火水木金土'[d.getDay()]}）`};
const fmtLong=s=>{let d=dateObj(s);return d?new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d):''};
const same=(a,b)=>a===b;
const isOverdue=t=>t.type==='task'&&!t.completed&&t.date&&t.date<todayISO();
const isToday=t=>t.date===todayISO();
const categoryColor=name=>(data.categories.find(x=>x.name===name)||{color:'#8592a8'}).color;
const seed=()=>{
 const a=[
 ['使い方を確認する','','','生活','normal','task','右上の「新しく追加」から、予定やタスクを作成できます。'],
 ['予定のサンプル','','','生活','normal','event','日時を設定するとカレンダーに表示されます。']
 ];return a.map(([title,date,time,category,priority,type,notes,endDate=''])=>({id:id(),title,date,time,endDate,endTime:'',category,priority,type,notes,important:false,completed:false,subtasks:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}));
};
function load(){try{let raw=localStorage.getItem(KEY);if(raw){let obj=JSON.parse(raw);if(Array.isArray(obj.items))return {items:obj.items,categories:Array.isArray(obj.categories)?obj.categories:DEFAULT_CATS,settings:{theme:'light',welcomeDismissed:false,...obj.settings}};}}catch(e){console.warn('Could not load storage',e)}return {items:[],categories:structuredClone(DEFAULT_CATS),settings:{theme:'light',welcomeDismissed:false}};}
let data=load();let ui={page:'home',calendarMode:'month',cursor:todayISO(),selected:todayISO(),sort:'date',search:'',drawer:null,modal:null,importCandidates:[],importRaw:'',mobileMenu:false};
let suppressCloudEvent=false; const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));if(!suppressCloudEvent)window.dispatchEvent(new Event('myplanner:localchange'));return true}catch(e){toast('保存に失敗しました。ストレージ容量・ブラウザ設定を確認してください。','error');return false}};
const applyTheme=()=>{document.documentElement.dataset.theme=data.settings.theme==='dark'?'dark':'light';};applyTheme();
const toast=(msg,type='')=>{let node=document.createElement('div');node.className='toast '+type;node.textContent=msg;$('#toasts').append(node);setTimeout(()=>node.remove(),3800)};
const sortedItems=(a,sort='date')=>[...a].sort((x,y)=>{
 if(sort==='priority')return (y.important-x.important)||({high:3,normal:2,low:1}[y.priority]-{high:3,normal:2,low:1}[x.priority])||(x.date||'9999').localeCompare(y.date||'9999');
 if(sort==='created')return String(y.createdAt).localeCompare(String(x.createdAt));
 if(sort==='name')return x.title.localeCompare(y.title,'ja');
 return (x.date||'9999-12-31').localeCompare(y.date||'9999-12-31')||(x.time||'').localeCompare(y.time||'')||(y.important-x.important);
});
const searchMatch=t=>!ui.search||`${t.title} ${t.category} ${t.notes||''} ${t.date||''}`.toLowerCase().includes(ui.search.toLowerCase());
const onDate=(t,day)=>!!t.date&&(t.type==='event'&&t.endDate?t.date<=day&&day<=t.endDate:t.date===day);
const dayItems=day=>sortedItems(data.items.filter(t=>onDate(t,day)), 'date');
const overdue=data=>data.items.filter(isOverdue).length;
const dueNext=(d,days=7)=>data.items.filter(x=>x.date&&!x.completed&&x.date>=d&&x.date<=plusDays(d,days));
const subStat=t=>t.subtasks?.length?`<span>${ICON('checkcircle')} ${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length}</span>`:'';
const categoryChip=(t)=>`<span class="color-label"><span class="category-dot" style="background:${esc(categoryColor(t.category))}"></span>${esc(t.category||'その他')}</span>`;
function navButton(page,name,ic,count,extra='') {return `<button type="button" class="nav-item ${ui.page===page?'active':''}" data-action="nav" data-page="${esc(page)}">${ic.startsWith('dot:')?`<span class="category-dot" style="background:${esc(ic.slice(4))}"></span>`:ICON(ic)}<span>${esc(name)}</span>${count!==undefined?`<span class="nav-count">${count}</span>`:''}</button>`}
const pageTitle=()=>({home:['ホーム','おかえりなさい。今日も一歩ずつ。'],calendar:['カレンダー','予定も締切も、一つの場所で。'],today:['今日のタスク','今日やることを整理しましょう。'],important:['重要','優先したいタスク。'],upcoming:['今後の予定','締切があるものをまとめて確認。'],all:['すべてのタスク','やることを一覧で管理。'],completed:['完了済み','積み上げた進捗を確認。'],overdue:['期限切れ','期限を過ぎたタスク。'],category:[ui.category||'カテゴリ','カテゴリごとのタスク。']})[ui.page]||['My Planner',''];
function shell(){const [title,desc]=pageTitle();const c=data.items.filter(x=>x.type==='task');return `<div class="shell"><aside class="sidebar ${ui.mobileMenu?'mobile-open':''}" id="sidebar"><div class="brand"><span class="brand-icon">${ICON('calendar')}</span><div><div class="brand-title">My Planner</div><div class="brand-sub">YOUR DAYS, IN ORDER.</div></div></div><div class="sidebar-section">ワークスペース</div>
 ${navButton('home','ホーム','home')}${navButton('calendar','カレンダー','calendar')}
 <div class="sidebar-section">To Do</div>
 ${navButton('today','今日','sun',c.filter(x=>!x.completed&&(x.date===todayISO()||x.date&&x.date<todayISO())).length)}
 ${navButton('important','重要','star',c.filter(x=>x.important&&!x.completed).length)}
 ${navButton('upcoming','今後の予定','clock')}${navButton('all','すべて','list',c.filter(x=>!x.completed).length)}
 ${navButton('completed','完了済み','checkcircle')}${navButton('overdue','期限切れ','alert',c.filter(isOverdue).length)}
 <div class="sidebar-section">カテゴリ</div>
 ${data.categories.map(cat=>navButton('category',cat.name,'dot:'+cat.color,undefined,cat.name).replace('data-page="category"','data-page="category" data-category="'+esc(cat.name)+'"')).join('')}
 <div class="sidebar-footer"><button class="nav-item" data-action="sync-open">${ICON('upload')}<span data-sync-label>Google同期を設定</span></button><button class="nav-item" data-action="ai">${ICON('sparkles')}<span>ChatGPTから取り込む</span></button><button class="nav-item" data-action="settings">${ICON('settings')}<span>設定・バックアップ</span></button><div class="storage-hint">${ICON('monitor')}<span>端末保存は常時有効<br>Google同期は任意・API課金なし</span></div></div></aside>
 <div class="main"><header class="topbar"><div style="display:flex;gap:9px;align-items:center;min-width:0"><button class="icon-btn mobile-menu" aria-label="メニュー" data-action="menu">${ICON('menu')}</button><div><div class="heading-eyebrow">MY WORKSPACE / ${esc(new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(new Date()))}</div><h1 class="page-heading">${esc(title)}</h1></div></div><div class="topbar-actions"><button class="sync-pill" id="syncPill" data-sync-state="local" data-action="sync-open">${ICON('upload')}<span data-sync-label>Google同期を設定</span></button><button class="icon-btn" title="ChatGPTから取り込む" aria-label="ChatGPTから取り込む" data-action="ai">${ICON('sparkles')}</button><button class="icon-btn" title="設定" aria-label="設定" data-action="settings">${ICON('settings')}</button><button class="btn primary" data-action="new">${ICON('plus')}<span class="wide-label">新しく追加</span></button></div></header><main class="content">${!data.settings.welcomeDismissed?`<div class="welcome"><div style="display:flex;gap:12px;align-items:center">${ICON('info')}<div><strong>初めてのご利用ですか？</strong><p>以前のHTMLアプリに予定がある場合は、旧アプリの設定からJSONを書き出し、こちらの設定から読み込んでください。Google同期は「Google同期を設定」から有効化できます。</p></div></div><button class="welcome-close" data-action="dismiss-welcome" aria-label="案内を閉じる">${ICON('x')}</button></div>`:''}${renderPage()}</main></div></div><div class="sidebar-shade backdrop ${ui.mobileMenu?'show':''}" style="z-index:30" data-action="menu-close"></div><nav class="mobile-nav">${[['home','ホーム','home'],['calendar','カレンダー','calendar'],['today','今日','sun'],['all','To Do','list'],['important','重要','star']].map(([p,n,ic])=>`<button class="${ui.page===p?'active':''}" data-action="nav" data-page="${p}">${ICON(ic)}<span>${n}</span></button>`).join('')}</nav>`;}
function renderPage(){if(ui.page==='home')return home();if(ui.page==='calendar')return calendar();return todos()}
function metric(label,value,ic,detail,style=''){return `<div class="surface metric"><div class="metric-top"><span>${label}</span><span class="metric-icon ${style}">${ICON(ic)}</span></div><span class="metric-number">${value}</span><span class="metric-detail">${detail}</span></div>`}
function home(){let all=data.items.filter(x=>x.type==='task');let remaining=all.filter(x=>!x.completed);let complete=all.length-remaining.length;let soon=dueNext(todayISO(),7),late=all.filter(isOverdue);let next=sortedItems(data.items.filter(x=>x.date&&x.date>=todayISO()&&!x.completed)).slice(0,8);let focus=[...late,...remaining.filter(x=>x.date===todayISO()),...remaining.filter(x=>x.important&&(!x.date||x.date>todayISO()))];let unique=[...new Map(focus.map(x=>[x.id,x])).values()].slice(0,7);return `<div class="overview-grid">${metric('未完了タスク',remaining.length,'list','進行中のやること')}${metric('直近7日の期限',soon.length,'calendar','今日から7日以内')}${metric('期限切れ',late.length,'alert','優先して確認','red')}${metric('完了したタスク',complete,'checkcircle',`${all.length?Math.round(complete/all.length*100):0}% 完了`,'green')}</div>
 <div class="dashboard-grid"><div style="display:flex;flex-direction:column;gap:18px"><section class="surface panel"><div class="panel-head"><div><div class="panel-title">今日のフォーカス</div><div class="muted-sm" style="margin-top:5px">重要・今日の期限・期限切れをまとめて表示</div></div><button class="text-link" data-action="nav" data-page="today">すべて見る →</button></div><div class="task-list">${unique.length?unique.map(taskRow).join(''):empty('今日は落ち着いて進められそうです','タスクを追加して始めましょう。')}</div><button class="btn ghost" style="margin-top:12px" data-action="new" data-type="task">${ICON('plus')} タスクを追加</button></section>

 <div class="dashboard-side"><section class="surface panel"><div class="mini-cal-toolbar"><div class="panel-title">${new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long'}).format(dateObj(ui.cursor))}</div><div style="display:flex;gap:3px"><button class="icon-btn" style="width:30px;min-height:30px" data-action="prev" aria-label="前月">${ICON('chev-left')}</button><button class="icon-btn" style="width:30px;min-height:30px" data-action="next" aria-label="翌月">${ICON('chev-right')}</button></div></div>${miniCalendar()}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span class="muted-sm">日付を選択して予定を表示</span><button class="text-link" data-action="nav" data-page="calendar">開く →</button></div></section>
 <section class="surface panel"><div class="panel-head"><div class="panel-title">進捗</div><span class="muted-sm">${all.length?Math.round(complete/all.length*100):0}% 完了</span></div><div class="progress-track"><div class="progress-fill" style="width:${all.length?complete/all.length*100:0}%"></div></div>${data.categories.map(cat=>{let n=all.filter(x=>x.category===cat.name);return `<div class="stat-row"><span class="color-label"><span class="category-dot" style="background:${esc(cat.color)}"></span>${esc(cat.name)}</span><span>${n.filter(x=>x.completed).length} / ${n.length}</span></div>`}).join('')}</section>

function miniCalendar(){let d=dateObj(ui.cursor),start=new Date(d.getFullYear(),d.getMonth(),1),n=start.getDay(),len=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let body='<div class="mini-cal">'+[...'日月火水木金土'].map(t=>`<div class="mini-day-header">${t}</div>`).join('');for(let i=0;i<Math.ceil((n+len)/7)*7;i++){let day=new Date(d.getFullYear(),d.getMonth(),i-n+1),s=iso(day);body+=`<button class="mini-date ${day.getMonth()!==d.getMonth()?'muted':''} ${s===todayISO()?'today':''} ${s===ui.selected?'selected':''} ${dayItems(s).length?'has-items':''}" data-action="select-date" data-date="${s}">${day.getDate()}</button>`}return body+'</div>'}

function empty(head,sub){return `<div class="empty">${ICON('checkcircle')}<strong>${esc(head)}</strong><p>${esc(sub)}</p></div>`}
function todos(){let a=data.items.filter(x=>x.type==='task').filter(searchMatch);if(ui.page==='today')a=a.filter(x=>!x.completed&&x.date&&x.date<=todayISO());if(ui.page==='important')a=a.filter(x=>x.important&&!x.completed);if(ui.page==='upcoming')a=a.filter(x=>!x.completed&&x.date>=todayISO());if(ui.page==='all')a=a.filter(x=>!x.completed);if(ui.page==='completed')a=a.filter(x=>x.completed);if(ui.page==='overdue')a=a.filter(isOverdue);if(ui.page==='category')a=a.filter(x=>x.category===ui.category);let ordered=sortedItems(a,ui.sort);let sections=[];if(['today','all','category'].includes(ui.page)&&ui.sort==='date'){
 let late=ordered.filter(isOverdue),now=ordered.filter(x=>!x.completed&&x.date===todayISO()),future=ordered.filter(x=>!x.completed&&x.date>todayISO()),nodate=ordered.filter(x=>!x.completed&&!x.date),complete=ordered.filter(x=>x.completed);sections=[['期限切れ',late],['今日',now],['今後',future],['期限なし',nodate],['完了済み',complete]];

function calendar(){let d=dateObj(ui.cursor);let label=ui.calendarMode==='month'?new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long'}).format(d):ui.calendarMode==='week'?`${fmtDate(iso(weekStart(d)),true)} 〜 ${fmtDate(plusDays(iso(weekStart(d)),6))}`:fmtLong(ui.cursor);return `<div class="toolbar"><div class="calendar-actions"><button class="icon-btn" data-action="prev" aria-label="前へ">${ICON('chev-left')}</button><button class="icon-btn" data-action="next" aria-label="次へ">${ICON('chev-right')}</button><button class="btn small" data-action="jump-today">今日</button><div class="calendar-title">${esc(label)}</div></div><div class="seg"><button class="${ui.calendarMode==='month'?'selected':''}" data-action="cal-mode" data-mode="month">月</button><button class="${ui.calendarMode==='week'?'selected':''}" data-action="cal-mode" data-mode="week">週</button><button class="${ui.calendarMode==='day'?'selected':''}" data-action="cal-mode" data-mode="day">日</button></div></div><div class="cal-layout"><section class="surface cal-card">${ui.calendarMode==='month'?monthCalendar():timelineCalendar()}</section><aside class="surface day-details">${dayDetails()}</aside></div><section class="surface compact-day-details">${dayDetails()}</section>`}
function monthCalendar(){let d=dateObj(ui.cursor),start=new Date(d.getFullYear(),d.getMonth(),1),offset=start.getDay(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),cells=Math.ceil((offset+days)/7)*7;let html=`<div class="week-header">${[...'日月火水木金土'].map(x=>`<div class="weekday">${x}</div>`).join('')}</div><div class="month-grid">`;for(let i=0;i<cells;i++){let dt=new Date(d.getFullYear(),d.getMonth(),i-offset+1),s=iso(dt),a=dayItems(s).filter(searchMatch),outside=dt.getMonth()!==d.getMonth();html+=`<div class="day-cell ${outside?'outside':''} ${ui.selected===s?'selected':''}" data-action="select-date" data-date="${s}" data-drop-date="${s}" title="${fmtLong(s)}"><div class="day-number ${s===todayISO()?'today':''}">${dt.getDate()}</div>${a.slice(0,3).map(t=>eventChip(t)).join('')}${a.length>3?`<div class="more-items">+${a.length-3} 件</div>`:''}</div>`}return html+'</div>'}

function timeEvent(t){let p=t.time.split(':').map(Number),start=p[0]*60+p[1];let end=t.endTime?Number(t.endTime.slice(0,2))*60+Number(t.endTime.slice(3)):start+(t.type==='event'?60:35);let h=Math.max(24,(Math.min(1440,Math.max(end,start+25))-start)*.8-4);return `<button draggable="true" data-drag-id="${esc(t.id)}" data-action="edit" data-id="${esc(t.id)}" class="time-event" style="top:${start*.8+2}px;height:${h}px;border-color:${esc(categoryColor(t.category))};background:${esc(categoryColor(t.category))}24"><strong>${esc(t.title)}</strong><span>${esc(t.time)}${t.endTime?' – '+esc(t.endTime):''}</span></button>`}

function renderDrawer(){if(!ui.drawer)return;const t=ui.drawer.draft;let isNew=!ui.drawer.id;$('#drawer').innerHTML=`<div class="drawer-head"><h2>${isNew?'新しく追加':'タスク・予定を編集'}</h2><button class="icon-btn" aria-label="閉じる" data-action="close">${ICON('x')}</button></div><form id="editForm" style="display:flex;flex-direction:column;min-height:0;flex:1"><div class="drawer-body"><div class="type-toggle"><label><input type="radio" name="type" value="task" ${t.type==='task'?'checked':''}>${ICON('checkcircle')} To Do</label><label><input type="radio" name="type" value="event" ${t.type==='event'?'checked':''}>${ICON('calendar')} 予定</label></div><div class="field"><label for="itemTitle">タイトル *</label><input id="itemTitle" maxlength="160" name="title" placeholder="何を予定していますか？" value="${esc(t.title)}" required></div><div class="fields-2"><div class="field"><label for="itemDate">${t.type==='event'?'開始日':'期限日'}（任意）</label><input id="itemDate" type="date" name="date" value="${esc(t.date)}"></div><div class="field"><label for="itemTime">開始時刻・締切時刻</label><input id="itemTime" type="time" name="time" value="${esc(t.time)}"></div></div><div class="fields-2 ${t.type!=='event'?'none':''}" id="eventEndFields"><div class="field"><label for="endDate">終了日（複数日対応）</label><input id="endDate" type="date" name="endDate" value="${esc(t.endDate||'')}"></div><div class="field"><label for="endTime">終了時刻</label><input id="endTime" type="time" name="endTime" value="${esc(t.endTime||'')}"></div></div><div class="fields-2"><div class="field"><label for="itemCategory">カテゴリ</label><select id="itemCategory" name="category">${data.categories.map(c=>`<option ${c.name===t.category?'selected':''} value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label for="itemPriority">優先度</label><select id="itemPriority" name="priority"><option value="high" ${t.priority==='high'?'selected':''}>高</option><option value="normal" ${t.priority==='normal'?'selected':''}>普通</option><option v function normalizeDate(s){if(!s)return '';if(typeof s!=='string')return '';let st=s.trim().replace(/\//g,'-');let m=st.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(!m)return '';let d=`${m[1]}-${pad(m[2])}-${pad(m[3])}`;return validDate(d)?d:''}
function normalizeAI(a){if(!a||typeof a!=='object'||Array.isArray(a))return null;let title=String(a.title||a.name||a.タイトル||'').trim().slice(0,160);if(!title)return null;let rawDate=a.date||a.dueDate||a.期限||'';let date=normalizeDate(rawDate);let time=typeof a.time==='string'&&timeValid(a.time)?a.time:'';let type=(a.type==='event'||a.種別==='予定')?'event':'task';let endDate=normalizeDate(a.endDate||'');if(endDate&&(!date||endDate<date))endDate='';let endTime=typeof a.endTime==='string'&&timeValid(a.endTime)?a.endTime:'';if(!date)time='';if(!time)endTime='';let category=String(a.category||a.カテゴリ||'就活').slice(0,24);let priority=['high','normal','low'].includes(a.priority)?a.priority:'normal';let notes=String(a.notes||a.メモ||'').slice(0,8000);let warning=rawDate&&!date?'日付が曖昧なため期限なしとして取り込み':'';if(warning)notes=(notes?notes+'\n':'')+'原文の日付: '+String(rawDate).slice(0,100);let now=new Date().toISOString();return {providedCompleted:typeof a.completed==='boolean',providedImportant:typeof a.important==='boolean',item:{id:typeof a.id==='string'&&a.id.length<100?a.id:id(),title,type,date,time,endDate:type==='event'?endDate:'',endTime:type==='event'?endTime:'',category,priority,notes,important:!!a.important,completed:!!a.completed&&type==='task',subtasks:Array.isArray(a.subtasks)?a.subtasks.slice(0,50).filter(x=>x&&typeof x.title==='string').map(s=>({id:id(),title:String(s.title).slice(0,160),done:!!s.done})):[],createdAt:now,updatedAt:now},warning}}
function previewAI(){const raw=$('#importText').value.trim();ui.importRaw=raw;let str=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();let parsed;try{parsed=JSON.parse(str)}catch(e){toast('JSON形式を読み取れませんでした。ChatGPTの出力を確認してください。','error');return}if(!Array.isArray(parsed)){parsed=parsed.items||parsed.tasks||parsed.events}if(!Array.isArray(parsed)){toast('JSON配列、または items 配列を貼り付けてください。','error');return}if(parsed.length>500){toast('一度に取り込めるのは500件までです。','error');return}let valid=parsed.map(normalizeAI).filter(Boolean);if(!valid.length){toast('タイトルのある予定・タスクが見つかりません。','error');return}ui.importCandidates=valid.map(({item,warning,providedCompleted,providedImportant})=>{let found=data.items.find(x=>x.id===item.id);let kind=found?'id':'';if(!found){found=data.items.find(x=>x.title.trim().toLowerCase()===item.title.trim().toLowerCase()&&x.category===item.category&&x.type===item.type);if(found)kind='title'}return {item,warning,providedCompleted,providedImportant,selected:true,existingId:found?.id||'',duplicate:kind}});renderModal();toast(`${valid.length}件の候補を確認できます`)}
function importAI(){let checkEls=[...document.querySelectorAll('.import-checkbox')];if(checkEls.length)checkEls.forEach(el=>ui.importCandidates[Number(el.dataset.index)].selected=el.checked);let chosen=ui.importCandidates.filter(x=>x.selected);if(!chosen.length){toast('取り込む項目を選択してください。','error');return}let created=0,updated=0;for(let c of chosen){let t=c.item;if(!data.categories.some(x=>x.name===t.category))data.categories.push({name:t.category,color:'#7b8cae',icon:'folder'});if(c.existingId){let existing=data.items.find(x=>x.id===c.existingId);if(existing){let completion=c.providedCompleted?t.completed:existing.completed;let important=c.providedImportant?t.important:existing.important;let subtasks=t.subtasks.length?t.subtasks:existing.subtasks;Object.assign(existing,{...t,id:existing.id,createdAt:existing.createdAt,updatedAt:new Date().toISOString(),completed:completion,important,subtasks});updated++;continue}}data.items.push({...t,id:id()});created++}save();ui.importCandidates=[];ui.importRaw='';closeOverlay();render();toast(`${created}件追加・${updated}件更新しました`)}

app.addEventListener('dragstart',e=>{let x=e.target.closest('[data-drag-id]');if(!x)return;e.dataTransfer.setData('text/plain',x.dataset.dragId);e.dataTransfer.effectAllowed='move'});
app.addEventListener('dragover',e=>{if(e.target.closest('[data-drop-date]'))e.preventDefault()});
app.addEventListener('drop',e=>{const day=e.target.closest('[data-drop-date]')?.dataset.dropDate,id=e.dataTransfer?.getData('text/plain');if(!day||!id)return;e.preventDefault();let t=data.items.find(x=>x.id===id);if(!t)return;let span=t.endDate&&t.date?Math.round((dateObj(t.endDate)-dateObj(t.date))/86400000):0;update(id,x=>{x.date=day;if(x.endDate)x.endDate=plusDays(day,span)});ui.selected=day;toast('日付を移動しました')});
// 外部サーバー不要。公開したPWAはService Workerでオフライン利用できます。
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
window.MyPlannerBridge={get:()=>structuredClone(data),applyCloud:(remote)=>{const oldTheme=data.settings.theme;suppressCloudEvent=true;try{data={items:remote.items,categories:remote.categories,settings:{...data.settings,theme:oldTheme,welcomeDismissed:true}};save();closeOverlay();render()}finally{suppressCloudEvent=false}},notify:toast,refresh:()=>render()};
render();
})();
</script>

<script src="./sync.js"></script>
